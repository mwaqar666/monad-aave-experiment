  liquidationRecords(where: liquidationRecordFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): liquidationRecordPage!
  marketReserve(id: String!): marketReserve
  marketReserves(where: marketReserveFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): marketReservePage!
  _meta: Meta
}

