}

type Query {
  account(id: String!): account
  accounts(where: accountFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): accountPage!
  position(id: String!): position
  positions(where: positionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): positionPage!
